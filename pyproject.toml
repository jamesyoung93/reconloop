[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reconloop"
version = "0.1.0"
description = "Reconcile a rebuilt metric against trusted reports, with an AI or rule-based judge and a show-your-work record."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["duckdb>=0.10"]

[project.optional-dependencies]
pdf = ["pdfplumber>=0.10"]
ocr = ["pytesseract>=0.3", "pdf2image>=1.16"]
dev = ["pytest>=7"]

[project.scripts]
reconloop = "reconloop.cli:main"

[project.urls]
Repository = "https://github.com/jamesyoung93/reconloop"
Issues = "https://github.com/jamesyoung93/reconloop/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
