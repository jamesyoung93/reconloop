name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,test-pdf,discovery]" build
      - name: Install OCR engine
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - run: python -m pytest -q
        env:
          RECONLOOP_REQUIRE_OCR: ${{ runner.os == 'Linux' && '1' || '0' }}
      - name: Check cluster setup script and OCR diagnostics
        if: runner.os == 'Linux'
        run: |
          bash -n deploy/install-ocr.sh
          python -m reconloop.cli doctor --ocr
      - run: python -m build
